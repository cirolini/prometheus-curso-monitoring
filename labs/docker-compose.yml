# Lab do curso de monitoracao com Prometheus.
# Sobe tudo com: make up   (na raiz do repo)
#
# As versoes estao no arquivo .env ao lado deste.

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Sem esta flag o /-/reload responde "Lifecycle API is not enabled."
      # Ela e' o que faz o modulo 08 funcionar.
      - --web.enable-lifecycle
      # Sem esta o delete_series responde "admin APIs disabled".
      # Em producao, pense duas vezes antes de habilitar.
      - --web.enable-admin-api
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION}
    container_name: lab-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: lab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Lab local. Nao repita isso em nada que va para a internet.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION}
    container_name: lab-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    container_name: lab-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    ports:
      - "9115:9115"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION}
    container_name: lab-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    container_name: lab-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  # O exporter de exemplo do modulo 05, ja containerizado.
  app:
    build: ./app
    image: lab-app:local
    container_name: lab-app
    ports:
      - "5000:5000"
    restart: unless-stopped

  # App de IA do modulo 10. Por padrao roda em modo mock, sem chave.
  llm-app:
    build: ./llm-app
    image: lab-llm-app:local
    container_name: lab-llm-app
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-model-1}
      LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-3.0}
      LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-15.0}
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Gera trafego continuo contra o app de IA, para os graficos e alertas
  # terem o que mostrar sem voce ficar apertando F5.
  llm-load:
    image: curlimages/curl:8.11.1
    container_name: lab-llm-load
    depends_on:
      - llm-app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -s -X POST http://llm-app:8000/ask \
            -H 'content-type: application/json' \
            -d '{"prompt":"explique observabilidade em uma frase"}' > /dev/null || true
          if [ $$(( RANDOM % 5 )) -eq 0 ]; then
            curl -s -X POST http://llm-app:8000/agent \
              -H 'content-type: application/json' \
              -d '{"prompt":"pesquise e resuma"}' > /dev/null || true
          fi
          sleep 3
        done
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
