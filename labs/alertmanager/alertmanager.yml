global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: default

  routes:
    # Atencao ao "matchers". O "match:" que aparece em tutoriais antigos
    # esta' deprecated desde o Alertmanager 0.22.
    - matchers:
        - severity = "none"
      receiver: devnull

    - matchers:
        - severity = "page"
      receiver: default
      continue: true

receivers:
  - name: default
  - name: devnull
